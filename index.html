    <!-- Critical inline styles for instant paint -->
    <style>
      /* Critical CSS for initial render */
      *,*::before,*::after{box-sizing:border-box}
      html{-webkit-text-size-adjust:100%;line-height:1.5}
      body{margin:0;font-family:'Inter','Plus Jakarta Sans',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
      #root{min-height:100vh}
      /* Loading state */
      .initial-loader{position:fixed;inset:0;background:#fff;display:flex;align-items:center;justify-content:center;z-index:99999}
      .loader-spinner{width:48px;height:48px;border:3px solid #e5e7eb;border-top-color:#3b82f6;border-radius:50%;animation:spin 0.8s linear infinite}
      @keyframes spin{to{transform:rotate(360deg)}}
      /* Hide loader when app loads */
      .app-loaded .initial-loader{opacity:0;pointer-events:none;transition:opacity 0.3s}
    </style>

  <body class="font-sans">
    <!-- Initial loading indicator -->
    <div class="initial-loader" id="initial-loader">
      <div class="loader-spinner"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <!-- Hide loader after React mounts -->
    <script>
      window.addEventListener('load', function() {
        document.body.classList.add('app-loaded');
        setTimeout(function() {
          var loader = document.getElementById('initial-loader');
          if (loader) loader.remove();
        }, 300);
      });
    </script>
